[package]
name = "localharvest"
version = "0.2.0"
description = "LocalHarvest, the desktop app for the table_extract pipeline"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "localharvest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-http = "2.8.3"
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# Keeping the computer awake during a run (src/awake.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
