# Required before merging into main. Blocks secrets and real documents.
#
# pull_request_target runs this file and the checker as they are on main, so a
# pull request cannot switch them off by editing them. The pull request is only
# fetched and read as data: never check it out or run anything from it here.
name: Sensitive data

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: sensitive-data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
      AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request's commits
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --quiet --no-tags origin "refs/pull/$PR_NUMBER/head"

      - name: Check for documents, data and secrets
        run: python3 .github/scripts/check_sensitive.py --range "$BEFORE..$AFTER"

      - name: Install gitleaks
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --quiet
          tar -xzf "$archive" gitleaks

      # Findings are printed from the report, redacted and without the file's text
      - name: Scan every commit with gitleaks
        if: ${{ !cancelled() }}
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code 0 \
            --report-format json --report-path "$report" \
            --log-opts="$BEFORE..$AFTER" .
          jq -r '.[] | "BLOCKED  \(.RuleID)  \(.File | @json):\(.StartLine)  commit \(.Commit[0:8])"' "$report"
          test "$(jq length "$report")" -eq 0
